name: Publish Docker images (GHCR)

on:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Build the exact commit referenced by the release tag.
          ref: ${{ github.event.release.tag_name }}

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/beer-friend-backend:${{ github.event.release.tag_name }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/beer-friend-frontend:${{ github.event.release.tag_name }}

      - name: Make container packages public
        uses: actions/github-script@v7
        with:
          script: |
            const repository = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const packages = ['beer-friend-backend', 'beer-friend-frontend'];
            for (const package_name of packages) {
              if (repository.data.owner.type === 'Organization') {
                await github.rest.packages.updatePackageForOrg({
                  org: context.repo.owner,
                  package_type: 'container',
                  package_name,
                  visibility: 'public',
                });
              } else {
                await github.rest.packages.updatePackageForAuthenticatedUser({
                  package_type: 'container',
                  package_name,
                  visibility: 'public',
                });
              }
            }
